<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Banner A — Tagline Hook</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow', sans-serif;
  }

  .banner {
    width: 1584px;
    height: 396px;
    background: #141418;
    position: relative;
    overflow: hidden;
  }

  /* Subtle radial glow — offset right to avoid profile photo zone */
  .banner::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 60%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(201, 169, 110, 0.08) 0%, rgba(201, 169, 110, 0.03) 40%, transparent 70%);
    pointer-events: none;
  }

  /* Secondary glow — top right corner warmth */
  .banner::after {
    content: '';
    position: absolute;
    top: -100px;
    right: -50px;
    width: 500px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(232, 204, 150, 0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Very subtle noise texture overlay */
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* Offset content to the right to clear profile photo zone (bottom-left) */
    padding-left: 380px;
    padding-right: 100px;
  }

  .tagline {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 46px;
    line-height: 1.25;
    color: #c9a96e;
    letter-spacing: 0.01em;
    max-width: 900px;
  }

  .tagline .emphasis {
    color: #e8cc96;
    font-style: italic;
    font-weight: 600;
  }

  .url {
    margin-top: 28px;
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    font-size: 17px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(201, 169, 110, 0.5);
  }

  /* Thin gold accent line — left side, above profile zone */
  .accent-line {
    position: absolute;
    left: 340px;
    top: 60px;
    bottom: 60px;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(201, 169, 110, 0.3) 30%, rgba(201, 169, 110, 0.3) 70%, transparent);
    z-index: 2;
  }

  /* Subtle bottom edge gradient */
  .bottom-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent 10%, rgba(201, 169, 110, 0.15) 40%, rgba(201, 169, 110, 0.15) 80%, transparent);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="noise"></div>
    <div class="accent-line"></div>
    <div class="bottom-fade"></div>
    <div class="content">
      <div class="tagline">
        You've Optimized Everything<br>
        <span class="emphasis">Except What Matters Most</span>
      </div>
      <div class="url">emotionmentoring.com</div>
    </div>
  </div>
</body>
</html>
