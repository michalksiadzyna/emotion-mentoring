  .ig svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}

  .ig .descriptor{font-family:'Playfair Display',serif;font-weight:400;font-style:italic;font-size:66px;color:#f5f3ee;letter-spacing:.03em;line-height:1.35}
  .frame-outer{position:absolute;inset:20px;border:1px solid rgba(201,169,110,0.22);z-index:3;pointer-events:none}
  .frame-inner{position:absolute;inset:32px;border:1px solid rgba(201,169,110,0.11);z-index:3;pointer-events:none}

  .label{font-size:14px;letter-spacing:0.3em;text-transform:uppercase;color:#c9a96e;text-align:center;margin:40px 0 16px}

  /* LinkedIn Banner */

  .li .audience{font-family:'Barlow',sans-serif;font-weight:300;font-size:16px;letter-spacing:.45em;text-transform:uppercase;color:#9a9890;white-space:nowrap}
  .li .frame-outer{inset:12px}
