<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medusa Merge Result</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0c;display:flex;flex-direction:column;align-items:center;padding:40px;gap:30px;font-family:sans-serif;color:#9a9890}
  .label{font-size:16px;letter-spacing:0.3em;text-transform:uppercase;color:#c9a96e}
  .row{display:flex;gap:30px;align-items:flex-start}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px}
  .col img{width:400px;height:400px;object-fit:contain;background:#111114;border:1px solid #222;border-radius:8px;padding:20px}
  .sm{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="label">Medusa Merge Result</div>
<div class="row">
  <div class="col">
    <img src="medusa-candidates/medusa-face-gold.svg" alt="Original">
    <div class="label" style="font-size:13px">Original (Complex Snakes)</div>
  </div>
  <div class="col">
    <img src="medusa-candidates/medusa-merged-gold.svg" alt="Merged">
    <div class="label" style="font-size:13px">Merged (Face + Simpler Snakes)</div>
  </div>
  <div class="col">
    <img src="medusa-candidates/medusa-snakes-gold.svg" alt="Snake source">
    <div class="label" style="font-size:13px">Snake Source</div>
  </div>
</div>
<div class="sm">Left: original face. Center: merged result. Right: snake style source.</div>
</body>
</html>
