<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Demo D — Curtain of Bars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0c; --gold:#c9a96e; --gold-dim:#85714a; --gold-hi:#f2e8d4; --gold-lt:#d9c491;
    --text:#b6b1a6; --text-dim:#76715f;
    --metal:linear-gradient(100deg,#6b5a35 0%,#a68c52 16%,#d9c391 30%,#fdf6e3 44%,#f4ead0 48%,#fdf6e3 52%,#cdb377 66%,#7a6538 84%,#a89058 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ink);
    overflow-x:hidden;
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Hero ---------- */
  #hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 6vw;
  }
  #hero .kicker{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.66rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:3.2vh;
  }
  #hero h1{font-weight:500;line-height:1.12;margin-bottom:3vh}
  #hero .l1{
    display:block;
    font-variant:small-caps;
    font-weight:500;
    font-size:clamp(2.1rem,5vw,3.4rem);
    background:var(--metal);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  #hero .l2{
    font-style:italic;
    font-size:clamp(1.35rem,2.6vw,1.65rem);
    color:var(--text);
    max-width:34em;
    margin:0 auto;
    line-height:1.5;
  }
  #hero .pill{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.66rem;
    text-transform:uppercase;
    letter-spacing:.16em;
    color:#171204;
    background:var(--metal);
    border-radius:100px;
    padding:16px 42px;
    margin-top:4vh;
  }
  .hx{opacity:0;transform:translateY(24px)}

  /* ---------- Curtain ---------- */
  #curtain{
    position:fixed;inset:0;
    z-index:10;
    display:flex;
    pointer-events:none;
  }
  .panel{
    flex:1 1 20%;
    height:100%;
    background:#050506;
    position:relative;
    will-change:transform;
  }
  .panel::after{
    content:'';
    position:absolute;
    top:0;right:0;bottom:0;
    width:1px;
    background:linear-gradient(180deg,
      rgba(201,169,110,0) 0%,
      rgba(201,169,110,.55) 18%,
      rgba(242,232,212,.75) 50%,
      rgba(201,169,110,.55) 82%,
      rgba(201,169,110,0) 100%);
  }

  /* ---------- Replay ---------- */
  #replay{
    position:fixed;
    right:28px;bottom:24px;
    z-index:30;
    background:none;border:none;cursor:pointer;
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.62rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--gold-dim);
    padding:10px 4px 10px 8px;
    transition:color .35s ease;
  }
  #replay:hover{color:var(--gold)}
</style>
<meta name="robots" content="noindex, nofollow">

<style>
/* live-site backdrop: the real website sits behind the effect */
#hero{position:fixed !important;inset:0 !important;width:100% !important;height:100% !important;
  margin:0 !important;padding:0 !important;max-width:none !important;transform:none;z-index:0}
#hero>*:not(.realsite){visibility:hidden !important}
.realsite{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;visibility:visible;z-index:0;background:#0a0a0c}
</style>

</head>
<body>

<section id="hero"><iframe class="realsite" src="/" title="Emotion Mentoring"></iframe>
  <p class="kicker hx">Emotion Mentoring for Leaders</p>
  <h1>
    <span class="l1 hx">See clearly. Lead well.</span>
    <span class="l1 hx">Protect what you have built.</span>
  </h1>
  <p class="l2 hx">I help leaders increase their capacity under pressure, develop a mind capable of better decisions, and remain effective through personal and professional crises.</p>
  <span class="pill hx">Begin with one powerful conversation</span>
</section>

<div id="curtain" aria-hidden="true">
  <div class="panel"></div>
  <div class="panel"></div>
  <div class="panel"></div>
  <div class="panel"></div>
  <div class="panel"></div>
</div>

<button id="replay" type="button">Replay</button>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script>
(function(){
  "use strict";

  var curtain  = document.getElementById('curtain');
  var panels   = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  var heroEls  = Array.prototype.slice.call(document.querySelectorAll('.hx'));
  var replayBtn = document.getElementById('replay');

  var tl = null;
  var playing = false;

  function build(){
    gsap.set(curtain, {display:'flex'});
    gsap.set(panels, {y:0});
    gsap.set(heroEls, {opacity:0, y:24});

    playing = true;
    tl = gsap.timeline({onComplete:function(){
      playing = false;
      gsap.set(curtain, {display:'none'});
    }});

    /* 0.3 — the bars lift, left to right */
    tl.to(panels, {
      y:'-102%',
      duration:0.6,
      ease:'power4.inOut',
      stagger:0.1
    }, 0.3);

    /* hero rises into place in sync with each clearing bar */
    tl.to(heroEls, {
      opacity:1,
      y:0,
      duration:0.62,
      ease:'power3.out',
      stagger:0.08
    }, 0.46);
  }

  function skip(){
    if (!playing) return;
    playing = false;
    if (tl) tl.kill();
    gsap.set(panels, {y:'-102%'});
    gsap.set(curtain, {display:'none'});
    gsap.set(heroEls, {opacity:1, y:0, clearProps:'transform'});
  }

  function replay(){
    if (tl) tl.kill();
    build();
  }

  window.addEventListener('pointerdown', function(e){
    if (e.target === replayBtn) return;
    skip();
  });
  window.addEventListener('keydown', skip);
  replayBtn.addEventListener('click', function(e){
    e.stopPropagation();
    replay();
  });

  build();
})();
</script>
</body>
</html>
