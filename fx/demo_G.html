<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo G — Chandelier Dust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0c; --gold:#c9a96e; --gold-dim:#85714a; --gold-hi:#f2e8d4; --gold-lt:#d9c491;
    --text:#b6b1a6; --text-dim:#76715f;
    --metal:linear-gradient(100deg,#6b5a35 0%,#a68c52 16%,#d9c391 30%,#fdf6e3 44%,#f4ead0 48%,#fdf6e3 52%,#cdb377 66%,#7a6538 84%,#a89058 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    overflow:hidden;
    font-family:'Cormorant Garamond',serif;
  }
  #hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 6vw;
    opacity:.35;
  }
  .kicker{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.66rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:3.2vh;
  }
  h1{font-weight:500;line-height:1.16;}
  .l1{
    display:block;
    font-variant:small-caps;
    font-weight:500;
    font-size:clamp(2.1rem,5vw,3.4rem);
    background:var(--metal);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .l2{
    font-style:italic;
    font-size:clamp(1.35rem,2.6vw,1.65rem);
    color:var(--text);
    max-width:34em;
    margin:3.4vh auto 0;
    line-height:1.5;
  }
  .pill{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.66rem;
    text-transform:uppercase;
    letter-spacing:.16em;
    color:#171204;
    background:var(--metal);
    border-radius:100px;
    padding:16px 42px;
    margin-top:4vh;
  }
  #dust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
  }
  #replay{
    position:fixed;
    right:26px;
    bottom:24px;
    z-index:10;
    background:none;
    border:1px solid rgba(201,169,110,.22);
    color:var(--gold-dim);
    font-family:'Jost',sans-serif;
    font-size:.6rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    padding:10px 20px 10px 24px;
    cursor:pointer;
    transition:color .3s ease,border-color .3s ease;
  }
  #replay:hover{color:var(--gold);border-color:rgba(201,169,110,.55);}
</style>
<meta name="robots" content="noindex, nofollow">

<style>
/* live-site backdrop: the real website sits behind the effect */
#hero{position:fixed !important;inset:0 !important;width:100% !important;height:100% !important;
  margin:0 !important;padding:0 !important;max-width:none !important;transform:none;z-index:0}
#hero>*:not(.realsite){visibility:hidden !important}
.realsite{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;visibility:visible;z-index:0;background:#0a0a0c}
</style>

</head>
<body>

<section id="hero"><iframe class="realsite" src="/" title="Emotion Mentoring"></iframe>
  <p class="kicker">Emotion Mentoring for Leaders</p>
  <h1>
    <span class="l1">See clearly. Lead well.</span>
    <span class="l1">Protect what you have built.</span>
  </h1>
  <p class="l2">I help leaders increase their capacity under pressure, develop a mind capable of better decisions, and remain effective through personal and professional crises.</p>
  <span class="pill">Begin with one powerful conversation</span>
</section>

<canvas id="dust"></canvas>
<button id="replay" type="button">Replay</button>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('dust');
  var ctx = canvas.getContext('2d');
  var hero = document.getElementById('hero');
  var replayBtn = document.getElementById('replay');

  var DUR = 1500;      // total effect length
  var GATHER = 700;    // particles begin drifting to headline baseline
  var SETTLE = 1100;   // particles settle + fade, hero eases to full opacity
  var COLORS = ['#d9c491','#fdf6e3','#c9a96e'];

  var dpr = 1, W = 0, H = 0;
  var particles = [];
  var startT = 0, lastT = 0, raf = 0, playing = false, heroEased = false;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(a, b){ return a + Math.random() * (b - a); }
  function smoothstep(t){ t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

  function buildParticles(){
    particles = [];
    var h1 = document.querySelector('h1');
    var r = h1.getBoundingClientRect();
    var cx = W / 2;
    var count = 220;
    for (var i = 0; i < count; i++){
      // gaussian-ish spread around top center
      var spread = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; // -1..1, center-weighted
      particles.push({
        x: cx + spread * Math.min(W * 0.16, 190),
        y: rand(-70, -6),
        vx: rand(-9, 9),
        vy: rand(95, 210),
        size: rand(1, 3),
        color: COLORS[(Math.random() * COLORS.length) | 0],
        baseA: rand(.45, 1),
        twF: rand(2.2, 6.5),      // twinkle frequency
        twP: rand(0, Math.PI * 2),// twinkle phase
        wobF: rand(.9, 2.1),      // horizontal drift frequency
        wobA: rand(6, 22),        // horizontal drift amplitude
        delay: rand(0, 320),      // staggered burst
        tx: r.left + Math.random() * r.width,
        ty: r.bottom - rand(0, 14)
      });
    }
  }

  function drawFrame(el, dt){
    ctx.clearRect(0, 0, W, H);
    var globalFade = el > SETTLE ? 1 - smoothstep((el - SETTLE) / (DUR - SETTLE)) : 1;
    var pull = el > GATHER ? smoothstep((el - GATHER) / (SETTLE - GATHER)) : 0;
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var t = el - p.delay;
      if (t <= 0) continue;
      // graceful fall with horizontal drift
      p.vy += 30 * dt; // faint gravity
      p.x += (p.vx + Math.sin(t / 1000 * p.wobF * Math.PI * 2 + p.twP) * p.wobA) * dt;
      p.y += p.vy * dt;
      // drift toward the headline baseline
      if (pull > 0){
        var k = Math.min(1, dt * 5.5 * pull);
        p.x += (p.tx - p.x) * k;
        p.y += (p.ty - p.y) * k;
      }
      var twinkle = .62 + .38 * Math.sin(t / 1000 * p.twF * Math.PI * 2 + p.twP);
      var a = p.baseA * twinkle * globalFade * smoothstep(t / 180);
      if (a <= 0.01) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function easeHero(){
    if (heroEased) return;
    heroEased = true;
    hero.style.transition = 'opacity .42s cubic-bezier(.22,.61,.36,1)';
    hero.style.opacity = '1';
  }

  function loop(now){
    if (!playing) return;
    var el = now - startT;
    var dt = Math.min((now - lastT) / 1000, .05);
    lastT = now;
    if (el >= SETTLE) easeHero();
    if (el >= DUR){ finish(); return; }
    drawFrame(el, dt);
    raf = requestAnimationFrame(loop);
  }

  function finish(){
    playing = false;
    if (raf) cancelAnimationFrame(raf);
    ctx.clearRect(0, 0, W, H);
    easeHero();
  }

  function skip(){
    if (!playing) return;
    playing = false;
    if (raf) cancelAnimationFrame(raf);
    ctx.clearRect(0, 0, W, H);
    heroEased = true;
    hero.style.transition = 'none';
    hero.style.opacity = '1';
  }

  function play(){
    if (raf) cancelAnimationFrame(raf);
    heroEased = false;
    hero.style.transition = 'none';
    hero.style.opacity = '.35';
    // force style flush so the reset is not batched with the ease
    void hero.offsetWidth;
    buildParticles();
    playing = true;
    startT = performance.now();
    lastT = startT;
    raf = requestAnimationFrame(loop);
  }

  window.addEventListener('pointerdown', skip);
  window.addEventListener('keydown', skip);
  replayBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  replayBtn.addEventListener('click', function(e){
    e.stopPropagation();
    play();
    replayBtn.blur();
  });

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(play);
  } else {
    play();
  }
})();
</script>
</body>
</html>
