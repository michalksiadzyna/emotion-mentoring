<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Demo A — The Gold Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0c; --gold:#c9a96e; --gold-dim:#85714a; --gold-hi:#f2e8d4; --gold-lt:#d9c491;
    --text:#b6b1a6; --text-dim:#76715f;
    --metal:linear-gradient(100deg,#6b5a35 0%,#a68c52 16%,#d9c391 30%,#fdf6e3 44%,#f4ead0 48%,#fdf6e3 52%,#cdb377 66%,#7a6538 84%,#a89058 100%);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); overflow:hidden;
    display:grid; place-items:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Hero ---------- */
  #hero{ text-align:center; padding:0 24px; max-width:1100px; position:relative; z-index:1; will-change:transform; }
  .kicker{
    font-family:'Jost',sans-serif; font-weight:400; font-size:.66rem;
    letter-spacing:.42em; text-transform:uppercase; color:var(--gold);
    margin:0 0 2.6vh;
  }
  h1{ margin:0 0 3vh; }
  .l1{
    display:block; font-family:'Cormorant Garamond',serif; font-weight:500;
    font-variant:small-caps; font-size:clamp(2.1rem,5vw,3.4rem); line-height:1.16;
    background:var(--metal); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .l2{
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(1.35rem,2.6vw,1.65rem); line-height:1.5;
    color:var(--text); max-width:34em; margin:0 auto;
  }
  .pill{
    display:inline-block; font-family:'Jost',sans-serif; font-weight:500;
    font-size:.66rem; text-transform:uppercase; letter-spacing:.16em;
    color:#171204; background:var(--metal); border-radius:100px;
    padding:16px 42px; margin-top:4vh;
  }

  /* ---------- Effect layers ---------- */
  #cut{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:5; pointer-events:none;
  }
  #flare{
    position:fixed; left:50%; top:49.44%;
    width:34vmin; height:8vmin;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(253,246,227,.75), rgba(217,196,145,.28) 46%, transparent 72%);
    filter:blur(6px); mix-blend-mode:screen;
    opacity:0; z-index:6; pointer-events:none; will-change:transform,opacity;
  }

  /* ---------- Replay ---------- */
  #replay{
    position:fixed; right:22px; bottom:20px; z-index:10;
    font-family:'Jost',sans-serif; font-weight:400; font-size:.62rem;
    text-transform:uppercase; letter-spacing:.3em; text-indent:.3em;
    color:var(--gold-dim); background:transparent;
    border:1px solid rgba(201,169,110,.25); border-radius:100px;
    padding:10px 20px; cursor:pointer;
    transition:color .35s ease, border-color .35s ease;
  }
  #replay:hover{ color:var(--gold); border-color:rgba(201,169,110,.7); }
</style>
<meta name="robots" content="noindex, nofollow">

<style>
/* live-site backdrop: the real website sits behind the effect */
#hero{position:fixed !important;inset:0 !important;width:100% !important;height:100% !important;
  margin:0 !important;padding:0 !important;max-width:none !important;transform:none;z-index:0}
#hero>*:not(.realsite){visibility:hidden !important}
.realsite{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;visibility:visible;z-index:0;background:#0a0a0c}
</style>

</head>
<body>

  <section id="hero"><iframe class="realsite" src="/" title="Emotion Mentoring"></iframe>
    <p class="kicker">Emotion Mentoring for Leaders</p>
    <h1>
      <span class="l1">See clearly. Lead well.</span>
      <span class="l1">Protect what you have built.</span>
    </h1>
    <p class="l2">I help leaders increase their capacity under pressure, develop a mind capable of better decisions, and remain effective through personal and professional crises.</p>
    <span class="pill">Begin with one powerful conversation</span>
  </section>

  <svg id="cut" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#85714a" stop-opacity="0"/>
        <stop offset=".18" stop-color="#d9c491"/>
        <stop offset=".5"  stop-color="#fdf6e3"/>
        <stop offset=".82" stop-color="#d9c491"/>
        <stop offset="1"   stop-color="#85714a" stop-opacity="0"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-400%" width="140%" height="900%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>
    <path id="panelTop" fill="#0a0a0c" d="M0,0 L1440,0 L1440,466 Q720,426 0,466 Z"/>
    <path id="panelBot" fill="#0a0a0c" d="M0,465 Q720,425 1440,465 L1440,900 L0,900 Z"/>
    <path id="threadGlow" d="M0,465 Q720,425 1440,465" fill="none"
          stroke="url(#tg)" stroke-width="10" opacity=".5" filter="url(#soft)"
          vector-effect="non-scaling-stroke"/>
    <path id="thread" d="M0,465 Q720,425 1440,465" fill="none"
          stroke="url(#tg)" stroke-width="1.8"
          vector-effect="non-scaling-stroke"/>
  </svg>

  <div id="flare"></div>

  <button id="replay" type="button">Replay</button>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script>
(function(){
  var hero   = document.getElementById('hero');
  var thread = document.getElementById('thread');
  var glow   = document.getElementById('threadGlow');
  var flare  = document.getElementById('flare');
  var top    = document.getElementById('panelTop');
  var bot    = document.getElementById('panelBot');
  var replay = document.getElementById('replay');

  function resolveInstant(){
    /* Fallback: no animation library — land on the finished hero. */
    top.style.display = 'none';
    bot.style.display = 'none';
    thread.style.display = 'none';
    glow.style.display = 'none';
    flare.style.display = 'none';
  }

  if (!window.gsap){
    resolveInstant();
    replay.addEventListener('click', function(){ location.reload(); });
    return;
  }

  var L = thread.getTotalLength();

  var tl = gsap.timeline({ paused:true });

  /* t = 0.0 — reset every layer (makes restart clean) */
  tl.set([top, bot], { y:0 }, 0)
    .set([thread, glow], { strokeDasharray:L, strokeDashoffset:L, opacity:1 }, 0)
    .set(thread, { attr:{ 'stroke-width':1.8 } }, 0)
    .set(flare, { opacity:0, scale:.4 }, 0)
    .set(hero,  { scale:1.045 }, 0)

    /* 0.0 – 0.5 s : the filament draws itself across the width */
    .to([thread, glow], { strokeDashoffset:0, duration:.5, ease:'power2.inOut' }, 0)

    /* 0.5 s : one soft pulse at the centre */
    .to(flare, { opacity:1, scale:1, duration:.16, ease:'power2.out' }, .5)
    .to(thread, { attr:{ 'stroke-width':2.6 }, duration:.16, ease:'power2.out' }, .5)
    .to(glow, { opacity:.9, duration:.16, ease:'power2.out' }, .5)
    .to(flare, { opacity:0, scale:1.7, duration:.3, ease:'power2.in' }, .66)

    /* 0.8 – 1.4 s : the black parts along the thread */
    .to(top, { y:-520, duration:.6, ease:'power4.inOut' }, .8)
    .to(bot, { y: 520, duration:.6, ease:'power4.inOut' }, .8)
    .to(hero, { scale:1, duration:.7, ease:'power3.out' }, .8)

    /* the thread settles into a faint beam… */
    .to(thread, { attr:{ 'stroke-width':1.4 }, duration:.4, ease:'power2.out' }, .9)
    .to([thread, glow], { opacity:.25, duration:.5, ease:'power2.out' }, .9)

    /* 1.4 s : hero stands calm — the beam fades away */
    .to([thread, glow], { opacity:0, duration:.8, ease:'power2.out' }, 1.4);

  function skip(){
    if (tl.progress() < 1) tl.progress(1);
  }

  window.addEventListener('click', skip);
  window.addEventListener('keydown', skip);

  replay.addEventListener('click', function(e){
    e.stopPropagation();
    tl.restart();
  });

  tl.play();
})();
</script>
</body>
</html>
