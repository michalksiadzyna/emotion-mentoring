<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Demo C — The Signet Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0c; --gold:#c9a96e; --gold-dim:#85714a; --gold-hi:#f2e8d4; --gold-lt:#d9c491;
    --text:#b6b1a6; --text-dim:#76715f;
    --metal:linear-gradient(100deg,#6b5a35 0%,#a68c52 16%,#d9c391 30%,#fdf6e3 44%,#f4ead0 48%,#fdf6e3 52%,#cdb377 66%,#7a6538 84%,#a89058 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ink);
    overflow-x:hidden;
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Hero ---------- */
  #hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 6vw;
  }
  #hero .kicker{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.66rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:3.2vh;
  }
  #hero h1{font-weight:500;line-height:1.12;margin-bottom:3vh}
  #hero .l1{
    display:block;
    font-variant:small-caps;
    font-weight:500;
    font-size:clamp(2.1rem,5vw,3.4rem);
    background:var(--metal);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  #hero .l2{
    font-style:italic;
    font-size:clamp(1.35rem,2.6vw,1.65rem);
    color:var(--text);
    max-width:34em;
    margin:0 auto;
    line-height:1.5;
  }
  #hero .pill{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.66rem;
    text-transform:uppercase;
    letter-spacing:.16em;
    color:#171204;
    background:var(--metal);
    border-radius:100px;
    padding:16px 42px;
    margin-top:4vh;
  }
  .hx{opacity:0;transform:translateY(16px)}

  /* ---------- Effect layers ---------- */
  #veil{
    position:fixed;inset:0;
    background:var(--ink);
    z-index:10;
  }
  #dust{
    position:fixed;inset:0;
    z-index:14;
    pointer-events:none;
  }
  #sealwrap{
    position:fixed;
    left:50%;top:50%;
    width:min(38vmin,240px);
    height:min(38vmin,240px);
    transform:translate(-50%,-50%);
    z-index:12;
    pointer-events:none;
  }
  #glow{
    position:absolute;inset:-70%;
    background:radial-gradient(circle,rgba(217,196,145,.34) 0%,rgba(201,169,110,.12) 34%,rgba(201,169,110,0) 68%);
    opacity:0;
  }
  #seal{
    position:absolute;inset:0;
    opacity:0;
    will-change:transform,opacity;
  }
  #seal svg{width:100%;height:100%;display:block;overflow:visible}

  /* ---------- Replay ---------- */
  #replay{
    position:fixed;
    right:28px;bottom:24px;
    z-index:30;
    background:none;border:none;cursor:pointer;
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.62rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--gold-dim);
    padding:10px 4px 10px 8px;
    transition:color .35s ease;
  }
  #replay:hover{color:var(--gold)}
</style>
<meta name="robots" content="noindex, nofollow">

<style>
/* live-site backdrop: the real website sits behind the effect */
#hero{position:fixed !important;inset:0 !important;width:100% !important;height:100% !important;
  margin:0 !important;padding:0 !important;max-width:none !important;transform:none;z-index:0}
#hero>*:not(.realsite){visibility:hidden !important}
.realsite{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;visibility:visible;z-index:0;background:#0a0a0c}
</style>

</head>
<body>

<section id="hero"><iframe class="realsite" src="/" title="Emotion Mentoring"></iframe>
  <p class="kicker hx">Emotion Mentoring for Leaders</p>
  <h1>
    <span class="l1 hx">See clearly. Lead well.</span>
    <span class="l1 hx">Protect what you have built.</span>
  </h1>
  <p class="l2 hx">I help leaders increase their capacity under pressure, develop a mind capable of better decisions, and remain effective through personal and professional crises.</p>
  <span class="pill hx">Begin with one powerful conversation</span>
</section>

<div id="veil"></div>

<div id="sealwrap">
  <div id="glow"></div>
  <div id="seal">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="metalStroke" x1="0%" y1="0%" x2="100%" y2="60%">
          <stop offset="0%"  stop-color="#6b5a35"/>
          <stop offset="16%" stop-color="#a68c52"/>
          <stop offset="30%" stop-color="#d9c391"/>
          <stop offset="46%" stop-color="#fdf6e3"/>
          <stop offset="52%" stop-color="#fdf6e3"/>
          <stop offset="66%" stop-color="#cdb377"/>
          <stop offset="84%" stop-color="#7a6538"/>
          <stop offset="100%" stop-color="#a89058"/>
        </linearGradient>
      </defs>
      <g transform="rotate(45 100 100)">
        <rect x="38" y="38" width="124" height="124" fill="none" stroke="url(#metalStroke)" stroke-width="1.6"/>
        <rect x="46" y="46" width="108" height="108" fill="none" stroke="url(#metalStroke)" stroke-width="0.7" opacity="0.85"/>
        <rect x="94" y="94" width="12" height="12" fill="url(#metalStroke)"/>
      </g>
    </svg>
  </div>
</div>

<canvas id="dust"></canvas>

<button id="replay" type="button">Replay</button>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script>
(function(){
  "use strict";

  var veil   = document.getElementById('veil');
  var seal   = document.getElementById('seal');
  var glow   = document.getElementById('glow');
  var canvas = document.getElementById('dust');
  var ctx    = canvas.getContext('2d');
  var heroEls = Array.prototype.slice.call(document.querySelectorAll('.hx'));
  var replayBtn = document.getElementById('replay');

  var tl = null;
  var playing = false;
  var particles = [];
  var rafId = null;
  var lastT = 0;

  function sizeCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  var TINTS = [
    [201,169,110],  /* gold    */
    [217,196,145],  /* gold-lt */
    [242,232,212],  /* gold-hi */
    [166,140,82]
  ];

  function spawnDust(){
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    var r  = Math.min(Math.min(window.innerWidth, window.innerHeight) * 0.19, 120);
    particles.length = 0;
    for (var i = 0; i < 160; i++){
      /* sample along the diamond outline: |dx| + |dy| = r * u */
      var edge = Math.random();
      var t = Math.random();
      var d = r * (0.62 + 0.38 * Math.random());
      var dx, dy;
      if (edge < 0.25){ dx =  d * t;        dy = -d * (1 - t); }
      else if (edge < 0.5){ dx =  d * (1 - t); dy =  d * t; }
      else if (edge < 0.75){ dx = -d * t;   dy =  d * (1 - t); }
      else { dx = -d * (1 - t); dy = -d * t; }
      var tint = TINTS[(Math.random() * TINTS.length) | 0];
      particles.push({
        x: cx + dx, y: cy + dy,
        vx: (Math.random() - 0.5) * 34,
        vy: -(34 + Math.random() * 96),
        size: 0.5 + Math.random() * 1.5,
        life: 0,
        max: 0.34 + Math.random() * 0.24,
        c: tint
      });
    }
    lastT = performance.now();
    if (rafId === null) rafId = requestAnimationFrame(step);
  }

  function step(now){
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    var alive = 0;
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.life += dt;
      if (p.life >= p.max) continue;
      alive++;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy -= 22 * dt; /* gentle lift */
      var k = 1 - p.life / p.max;
      ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + (k * 0.9).toFixed(3) + ')';
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    if (alive > 0){
      rafId = requestAnimationFrame(step);
    } else {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.length = 0;
      rafId = null;
    }
  }

  function clearDust(){
    particles.length = 0;
    if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }

  function build(){
    /* reset to start state */
    clearDust();
    gsap.set(veil, {opacity:1, display:'block'});
    gsap.set(seal, {opacity:0, scale:7, transformOrigin:'50% 50%'});
    gsap.set(glow, {opacity:0});
    gsap.set(heroEls, {opacity:0, y:16});

    playing = true;
    tl = gsap.timeline({onComplete:function(){ playing = false; }});

    /* 0.0 — the seal descends and presses in */
    tl.to(seal, {opacity:1, duration:0.22, ease:'power1.out'}, 0.02);
    tl.to(seal, {scale:1, duration:0.54, ease:'power4.in'}, 0.02);

    /* 0.56 — impact */
    tl.to(glow, {opacity:1, duration:0.07, ease:'power1.out'}, 0.54);
    tl.to(seal, {scale:0.965, duration:0.07, ease:'power2.out'}, 0.56);
    tl.to(seal, {scale:1, duration:0.16, ease:'power2.out'}, 0.63);
    tl.to(glow, {opacity:0.22, duration:0.16, ease:'power2.out'}, 0.62);

    /* one heartbeat */
    tl.to(glow, {opacity:0.5, duration:0.1, ease:'power1.inOut', yoyo:true, repeat:1}, 0.7);

    /* 0.9 — dissolve into dust */
    tl.add(spawnDust, 0.9);
    tl.to(seal, {opacity:0, scale:1.05, duration:0.24, ease:'power2.out'}, 0.9);
    tl.to(glow, {opacity:0, duration:0.28, ease:'power2.out'}, 0.9);

    /* the veil breathes away, hero rises beneath */
    tl.to(veil, {opacity:0, duration:0.5, ease:'power2.inOut'}, 0.92);
    tl.set(veil, {display:'none'}, 1.42);
    tl.to(heroEls, {opacity:1, y:0, duration:0.4, ease:'power3.out', stagger:0.04}, 0.96);
  }

  function skip(){
    if (!playing) return;
    playing = false;
    if (tl) tl.kill();
    clearDust();
    gsap.set(veil, {opacity:0, display:'none'});
    gsap.set(seal, {opacity:0});
    gsap.set(glow, {opacity:0});
    gsap.set(heroEls, {opacity:1, y:0, clearProps:'transform'});
  }

  function replay(){
    if (tl) tl.kill();
    build();
  }

  window.addEventListener('pointerdown', function(e){
    if (e.target === replayBtn) return;
    skip();
  });
  window.addEventListener('keydown', skip);
  replayBtn.addEventListener('click', function(e){
    e.stopPropagation();
    replay();
  });

  build();
})();
</script>
</body>
</html>
