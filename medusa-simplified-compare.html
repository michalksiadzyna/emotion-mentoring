<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medusa Simplified Heads</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0c;display:flex;flex-direction:column;align-items:center;padding:40px;gap:30px;font-family:sans-serif;color:#9a9890}
  .label{font-size:16px;letter-spacing:0.3em;text-transform:uppercase;color:#c9a96e}
  .row{display:flex;gap:30px;align-items:flex-start}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px}
  .col img{width:450px;height:450px;object-fit:contain;background:#111114;border:1px solid #222;border-radius:8px;padding:20px}
  .sm{font-size:13px;color:#c9a96e}
</style>
</head>
<body>
<div class="label">Snake Head Simplification</div>
<div class="row">
  <div class="col">
    <img src="medusa-candidates/medusa-face-gold.svg" alt="Before">
    <div class="sm">Before (complex snake heads)</div>
  </div>
  <div class="col">
    <img src="medusa-candidates/medusa-simplified-gold.svg" alt="After">
    <div class="sm">After (simplified rounded tips)</div>
  </div>
</div>
</body>
</html>
