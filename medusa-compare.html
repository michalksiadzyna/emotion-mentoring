<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medusa Comparison</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0c;display:flex;flex-direction:column;align-items:center;padding:40px;gap:30px;font-family:sans-serif;color:#9a9890}
  .label{font-size:16px;letter-spacing:0.3em;text-transform:uppercase;color:#c9a96e}
  .row{display:flex;gap:40px;align-items:flex-start}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px}
  .col img{width:450px;height:450px;object-fit:contain;background:#111114;border:1px solid #222;border-radius:8px;padding:20px}
  .desc{font-size:13px;color:#666;max-width:450px;text-align:center}
</style>
</head>
<body>
<div class="label">Medusa Face Comparison</div>
<div class="row">
  <div class="col">
    <img src="medusa-candidates/medusa-face-gold.svg" alt="Face version">
    <div class="label" style="font-size:14px">Image 1: Face + Shoulders</div>
    <div class="desc">The base face you want to keep</div>
  </div>
  <div class="col">
    <img src="medusa-candidates/medusa-snakes-gold.svg" alt="Snakes version">
    <div class="label" style="font-size:14px">Image 2: Simpler Snakes</div>
    <div class="desc">The snake style you prefer</div>
  </div>
</div>
</body>
</html>
