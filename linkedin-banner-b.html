<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Banner B — Authority Positioning</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow', sans-serif;
  }

  .banner {
    width: 1584px;
    height: 396px;
    background: #141418;
    position: relative;
    overflow: hidden;
  }

  /* Deep subtle glow — centered-right */
  .banner::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 55%;
    transform: translate(-50%, -50%);
    width: 1100px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(201, 169, 110, 0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Noise texture */
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* Shift center slightly right to account for profile photo overlap on left */
    padding-left: 160px;
    padding-right: 60px;
  }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 64px;
    color: #c9a96e;
    letter-spacing: 0.04em;
    text-align: center;
  }

  /* Gold horizontal line divider */
  .divider {
    width: 220px;
    height: 1px;
    background: linear-gradient(to right, transparent, #c9a96e, transparent);
    margin: 24px 0;
  }

  .subtitle {
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    font-size: 21px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #f5f3ee;
    opacity: 0.7;
    text-align: center;
  }

  .url {
    margin-top: 22px;
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(201, 169, 110, 0.45);
    text-align: center;
  }

  /* Geometric corner accents — top-right and bottom-right */
  .corner-tr {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-top: 1px solid rgba(201, 169, 110, 0.2);
    border-right: 1px solid rgba(201, 169, 110, 0.2);
    z-index: 2;
  }

  .corner-br {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-bottom: 1px solid rgba(201, 169, 110, 0.2);
    border-right: 1px solid rgba(201, 169, 110, 0.2);
    z-index: 2;
  }

  /* Thin horizontal lines spanning the banner — architectural feel */
  .line-top {
    position: absolute;
    top: 30px;
    left: 340px;
    right: 100px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(201, 169, 110, 0.08) 20%, rgba(201, 169, 110, 0.08) 80%, transparent);
    z-index: 2;
  }

  .line-bottom {
    position: absolute;
    bottom: 30px;
    left: 340px;
    right: 100px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(201, 169, 110, 0.08) 20%, rgba(201, 169, 110, 0.08) 80%, transparent);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="noise"></div>
    <div class="corner-tr"></div>
    <div class="corner-br"></div>
    <div class="line-top"></div>
    <div class="line-bottom"></div>
    <div class="content">
      <div class="brand-name">Emotion Mentoring</div>
      <div class="divider"></div>
      <div class="subtitle">Structural Emotional Transformation for Leaders</div>
      <div class="url">emotionmentoring.com</div>
    </div>
  </div>
</body>
</html>
