<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Graphic — A vs B</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141418;
    color: #f5f3ee;
    font-family: 'Segoe UI', sans-serif;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #c9a96e;
  }
  .compare {
    display: flex;
    gap: 30px;
    max-width: 1200px;
    width: 100%;
    justify-content: center;
  }
  .version {
    flex: 1;
    max-width: 540px;
  }
  .version img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 4px;
  }
  .version-label {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #9a9890;
  }
  .version-label strong {
    color: #c9a96e;
  }
</style>
</head>
<body>

<h1>Facebook Graphic — Pick One</h1>

<div class="compare">
  <div class="version">
    <img src="fb_graphic_A.png" alt="Version A">
    <p class="version-label"><strong>A</strong> — Cover featured</p>
  </div>
  <div class="version">
    <img src="fb_graphic_B.png" alt="Version B">
    <p class="version-label"><strong>B</strong> — Typographic</p>
  </div>
</div>

</body>
</html>
